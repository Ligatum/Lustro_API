[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
features = ["python"]
profile  = "release"

[project]
name = "lustro"
readme = "README.md"
license-files = ["LICENSE.md"]
requires-python = ">=3.11,<3.15"
dependencies = ["numpy", "typing-extensions>=4.6"]
dynamic = ["version", "description"]

[project.urls]
FAQ        = "https://github.com/Ligatum/Lustro/blob/MAIN/DOCS/FAQ.md"
Repository = "https://github.com/Ligatum/Lustro_API"
Homepage   = "https://github.com/Ligatum/Lustro"
