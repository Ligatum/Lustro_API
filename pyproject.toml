[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
features = ["python"]
profile  = "release"

[project]
name = "lustro"
readme = "README.md"
dependencies = ["numpy"]
dynamic = ["version", "description"]

[project.urls]
Homepage   = "https://github.com/Ligatum/Lustro"
Repository = "https://github.com/Ligatum/Lustro_API"
FAQ        = "https://github.com/Ligatum/Lustro/blob/MAIN/DOCS/FAQ.md"