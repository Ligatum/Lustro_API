[package]
name         = "lustro"
version      = "1.0.0"
edition      = "2021"
rust-version = "1.90"
description  = "Lustro V1 is a 256-bit deterministic, single-pass diffusion engine with HASH/PRNG/XOF capabilities, providing live state-forking (stream tree branching)"
license-file = "LICENSE.md"
repository   = "https://github.com/Ligatum/Lustro_API"
homepage     = "https://github.com/Ligatum/Lustro"
readme       = "README.md"
keywords     = ["prng", "hash", "xof", "rng", "forking"]
categories   = ["algorithms", "game-development", "simulation"]

[lib]
name       = "lustro"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
python  = ["dep:pyo3", "dep:numpy"]
ffi     = []
rand    = ["dep:rand_core", "entropy"]
entropy = ["dep:getrandom", "rand_core?/getrandom"]

[dependencies]
pyo3   = { version = "0.22", features = ["extension-module"], optional = true }
numpy  = { version = "0.22", optional = true }
rayon  = { version = "1.10", optional = true }
rand_core = { version = "0.6", features = ["alloc"], optional = true }
getrandom = { version = "0.2", features = ["std"], optional = true }

[build-dependencies]
cbindgen = "0.27"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "unwind"
strip         = true
debug         = false
incremental   = false

[profile.release-python]
inherits = "release"
panic    = "unwind"

[profile.release-ffi]
inherits = "release"
panic    = "unwind"
